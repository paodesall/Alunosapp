name: Deploy PWA & Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pwa:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Empacotar www/
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Capacitor 7
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Configurar Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.almeida.alunosapp",
            "appName": "AlunosApp",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Verificar conteúdo de www/
        run: ls -la www/

      - name: Adicionar plataforma Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: AlunosApp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar Release (somente em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
